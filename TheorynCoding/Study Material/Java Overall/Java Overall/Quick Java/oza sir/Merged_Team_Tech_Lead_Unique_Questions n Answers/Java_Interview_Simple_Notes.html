function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveCurrent(){if(selected===null)return;try{localStorage.setItem(key(selected,'answer'),answer.value);localStorage.setItem(key(selected,'status'),status.value);saveinfo.textContent='Saved automatically';}catch(e){saveinfo.textContent='Browser storage unavailable. Copy your answer as backup.';}}
function selectQuestion(id){saveCurrent();selected=id;const q=questions.find(x=>x.id===id);if(!q)return;title.textContent=q.question;number.textContent='QUESTION '+q.id+' · '+q.section;answer.value=localStorage.getItem(key(id,'answer'))||'';status.value=localStorage.getItem(key(id,'status'))||'Not started';saveinfo.textContent='Answers save automatically in this browser.';renderList();}
answer.addEventListener('input',saveCurrent);status.addEventListener('change',saveCurrent);search.addEventListener('input',renderList);
document.getElementById('prev').onclick=()=>{let i=questions.findIndex(q=>q.id===selected);if(i>0)selectQuestion(questions[i-1].id)};
document.getElementById('next').onclick=()=>{let i=questions.findIndex(q=>q.id===selected);if(i>=0&&i<questions.length-1)selectQuestion(questions[i+1].id)};
renderList();if(selected!==null)selectQuestion(selected);
</script></body></html>
